<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Neighborhood Rider</title>
    <style>
      :root {
        --splash-bg: #0f172a;
        --splash-accent: #f97316;
      }
      html, body {
        margin: 0;
        background: var(--splash-bg);
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background:
          linear-gradient(to top, rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.3)),
          url("%PUBLIC_URL%/background.pg"),
          url("%PUBLIC_URL%/background.png") center center / cover no-repeat;
        transition: opacity 320ms ease, visibility 320ms ease;
      }
      #app-splash.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-card {
        display: grid;
        place-items: center;
        gap: 14px;
        text-align: center;
        padding: 32px 24px;
        border-radius: 24px;
        backdrop-filter: blur(4px);
        background: rgba(2, 6, 23, 0.52);
        border: 2px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
      }
      .splash-logo {
        width: 112px;
        height: 112px;
        object-fit: cover;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }
      .splash-title {
        margin: 0;
        font: 900 clamp(42px, 7.5vw, 86px)/0.96 "Outfit", sans-serif;
        letter-spacing: 2.2px;
        text-transform: uppercase;
        text-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
      .splash-subtitle {
        margin: 0;
        font: 700 clamp(15px, 2.2vw, 21px)/1.35 "Outfit", sans-serif;
        color: rgba(255, 255, 255, 0.96);
        max-width: 34ch;
      }
      .splash-bar {
        width: min(340px, 82vw);
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.25);
        overflow: hidden;
      }
      .splash-bar::before {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: var(--splash-accent);
        animation: splash-progress 1.1s ease-in-out infinite;
      }
      @keyframes splash-progress {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(340%); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app-splash" aria-label="Application loading screen">
      <div class="splash-card">
        <img class="splash-logo" src="%PUBLIC_URL%/logo.jpeg" alt="Nitume Doorbell Service" />
        <h1 class="splash-title">Nitume Doorbell Service</h1>
        <p class="splash-subtitle">Launching your neighborhood delivery network</p>
        <div class="splash-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
